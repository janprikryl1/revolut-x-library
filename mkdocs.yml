site_name: Revolut X Multi-Language SDK
site_description: Python and PHP SDKs for the Revolut X Crypto Exchange REST API (v1.0)
site_url: https://janprikryl1.github.io/revolut-x-library/
repo_name: janprikryl/revolut-x-library
repo_url: https://github.com/janprikryl1/revolut-x-library
copyright: "Copyright &copy; 2026 Jan Přikryl | Diplomová práce VŠB-TUO"

theme:
  name: ivory
  logo: assets/logo.png

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python/src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

nav:
  - Domů: index.md
  - Koncepty a Protokol:
      - Ed25519 Autentizace: concepts/auth_ed25519.md
      - 0% Maker Strategie: concepts/maker_strategy.md
  - Python SDK:
      - Rychlý start: python/quickstart.md
      - Průvodci:
          - Tržní data: python/guide/market_data.md
          - Objednávky: python/guide/orders.md
          - Účet a zůstatky: python/guide/account.md
          - AI Agenti: python/guide/ai_agents.md
      - API Reference:
          - Klient (RevolutXClient): python/api/client.md
          - Market Data API: python/api/market.md
          - Orders API: python/api/orders.md
          - Account API: python/api/account.md
          - Helpers & Buildery: python/api/helpers.md
          - Typy & Enumy: python/api/types.md
          - Výjimky: python/api/exceptions.md
  - PHP SDK:
      - Rychlý start: php/quickstart.md
      - Průvodci:
          - Tržní data: php/guide/market_data.md
          - Objednávky: php/guide/orders.md
          - Účet a zůstatky: php/guide/account.md
          - 0% Maker Strategie: php/guide/maker_strategy.md
      - API Reference: php/api/reference.md
  - AI Integrace: ai_agents.md
