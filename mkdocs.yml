site_name: Revolut X Python
site_description: Python SDK for the Revolut X Crypto Exchange REST API (v1.0)
site_url: https://janprikryl1.github.io/revolut-x-python/
repo_name: janprikryl/revolut-x-python
repo_url: https://github.com/janprikryl1/revolut-x-python
copyright: "Copyright &copy; 2026 Jan Přikryl | Diplomová práce VŠB-TUO"

theme:
  name: material
  custom_dir: overrides
  logo: assets/logo.png
  favicon: assets/logo.png
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

extra:
  # Verify Google Search Console:
  google_site_verification: "tNkr4srMPz0aD-ynrqRJOvq0eVSvvL6cMDe0tbks1aw"

plugins:
  - search
  - i18n:
      languages:
        - locale: en
          name: English
          default: true
        - locale: cs
          name: Čeština
          site_description: Python SDK pro Revolut X Crypto Exchange REST API (v1.0)
          nav_translations:
            Home: Domů
            Quick Start: Rychlý start
            User Guide: Uživatelská příručka
            Public Market Data: Veřejná tržní data
            Order Management: Správa objednávek
            Account & Balances: Účet a zůstatky
            AI Agent Integration: Integrace AI agentů
            Protocol Concepts: Koncepty protokolu
            Ed25519 Authentication: Autentizace Ed25519
            0% Maker Strategy: 0% Maker strategie
            API Reference: API Reference
            Client (RevolutXClient): Klient (RevolutXClient)
            Market Data API: Market Data API
            Orders API: Orders API
            Account API: Account API
            Helpers & Builders: Pomocné třídy a buildery
            Types & Enums: Typy a enumy
            Exceptions: Výjimky
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - User Guide:
      - Public Market Data: guide/market_data.md
      - Order Management: guide/orders.md
      - Account & Balances: guide/account.md
      - AI Agent Integration: guide/ai_agents.md
  - Protocol Concepts:
      - Ed25519 Authentication: concepts/auth_ed25519.md
      - 0% Maker Strategy: concepts/maker_strategy.md
  - API Reference:
      - Client (RevolutXClient): api/client.md
      - Market Data API: api/market.md
      - Orders API: api/orders.md
      - Account API: api/account.md
      - Helpers & Builders: api/helpers.md
      - Types & Enums: api/types.md
      - Exceptions: api/exceptions.md
