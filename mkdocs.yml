site_name: Revolut X Python
site_description: Python SDK for the Revolut X Crypto Exchange REST API (v1.0)
site_url: https://janprikryl1.github.io/revolut-x-python/
repo_name: janprikryl/revolut-x-python
repo_url: https://github.com/janprikryl1/revolut-x-python
copyright: "Copyright &copy; 2026 Jan Přikryl | Diplomová práce VŠB-TUO"

theme:
  name: ivory
  logo: assets/logo.png

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python/src]
          options:
            docstring_style: google
            docstring_section_style: table
            show_root_heading: true
            show_root_toc_entry: true
            show_root_full_path: false
            show_signature_annotations: true
            show_source: true
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - def_list

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - User Guide:
      - Public Market Data: guide/market_data.md
      - Order Management: guide/orders.md
      - Account & Balances: guide/account.md
      - AI Agent Integration: guide/ai_agents.md
  - Protocol Concepts:
      - Ed25519 Authentication: concepts/auth_ed25519.md
      - 0% Maker Strategy: concepts/maker_strategy.md
  - API Reference:
      - Client (RevolutXClient): api/client.md
      - Market Data API: api/market.md
      - Orders API: api/orders.md
      - Account API: api/account.md
      - Helpers & Builders: api/helpers.md
      - Types & Enums: api/types.md
      - Exceptions: api/exceptions.md
