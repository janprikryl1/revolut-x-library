[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revolut-x-python"
version = "0.0.6"
description = "Python SDK for the Revolut X Crypto Exchange REST API (v1.0)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jan Přikryl" },
]
keywords = ["revolut", "revolut-x", "crypto", "exchange", "trading", "api", "sdk", "bitcoin"]
dependencies = [
    "requests>=2.31.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "build>=1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-ivory>=0.4.0",
    "mkdocstrings[python]>=0.24.0",
    "pymdown-extensions>=10.0",
]

[project.urls]
Homepage = "https://janprikryl1.github.io/revolut-x-library/"
Repository = "https://github.com/janprikryl1/revolut-x-library"
Issues = "https://github.com/janprikryl1/revolut-x-library/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revolut_x = ["py.typed"]
