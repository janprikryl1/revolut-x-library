[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "revolut-x-python"
version = "0.1.0"
description = "Python SDK for the Revolut X Crypto Exchange REST API"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jan Přikryl" },
]
keywords = ["revolut", "revolut-x", "crypto", "exchange", "trading", "api", "sdk", "bitcoin"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.31.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "build>=1.0",
]

[project.urls]
Homepage = "https://github.com/janprikryl/revolut-x-python"
Documentation = "https://github.com/janprikryl/revolut-x-python#readme"
Repository = "https://github.com/janprikryl/revolut-x-python"
Issues = "https://github.com/janprikryl/revolut-x-python/issues"

[tool.setuptools.packages.find]
include = ["revolut_x*"]
